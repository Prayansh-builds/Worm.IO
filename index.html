<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120a33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Glow Worm">
<title>Glow Worm</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f3a1a;--gold:#ffc83d;--hot:#e5484d;--ice:#2f8fe0;--panel:rgba(255,255,255,.9)}
html,body{height:100%;margin:0;background:#120a33;color:var(--ink);font-family:"Chakra Petch",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#card{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(0,0,0,.14);border-radius:22px;padding:22px 24px;max-width:380px;width:100%;max-height:100%;overflow-y:auto;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.28);touch-action:pan-y}
h1{margin:0 0 4px;font-size:44px;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.08)}
p{margin:7px 0;opacity:.85;line-height:1.4;font-size:14px}
input{width:100%;box-sizing:border-box;margin-top:8px;padding:10px 14px;border-radius:12px;border:1px solid rgba(128,128,128,.5);background:rgba(128,128,128,.14);color:var(--ink);font:500 17px "Chakra Petch",system-ui,sans-serif;text-align:center}
button{font:700 20px "Chakra Petch",system-ui,sans-serif;color:#1a1040;background:var(--gold);border:0;border-radius:999px;padding:12px 38px;cursor:pointer;box-shadow:0 0 26px rgba(255,200,61,.55)}
#go{margin-top:12px}
button:focus-visible,input:focus-visible{outline:3px solid var(--ice);outline-offset:3px}
#sk,#th{display:flex;gap:10px;justify-content:center;margin:10px 0 2px}
#sk button,#th button{width:40px;height:40px;padding:0;font-size:15px;box-shadow:none;border:2px solid transparent;color:#fff}
#sk button.on,#th button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--panel)}
#sk button.lk{opacity:.35}
#lb,#hall{margin:6px 0 0;padding:0;list-style:none;font-size:14px;text-align:left}
#lb li,#hall li{display:flex;justify-content:space-between;padding:2px 6px}
#bst{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:92px;height:92px;border-radius:50%;padding:0;background:var(--panel);color:var(--ink);border:2px solid var(--hot);box-shadow:0 4px 16px rgba(0,0,0,.35);font-size:17px}
#mu{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:44px;height:44px;padding:0;font-size:18px;background:var(--panel);color:var(--ink);box-shadow:none}
.hide{display:none!important}
.sm{font-size:16px;padding:9px 18px;margin:6px 3px}
.alt{background:var(--panel);color:var(--ink);border:2px solid var(--ink);box-shadow:none}
#go,#mp{padding:12px 20px;margin:12px 3px 0;font-size:18px}
#lcode{letter-spacing:.25em;font-size:22px}
#lin{width:150px;display:inline-block;margin:6px 3px;text-transform:uppercase}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="bst" class="hide" aria-label="Boost">Boost</button>
<button id="mu" aria-label="Toggle sound">&#9835;</button>
<div id="ov"><div id="card">
<h1 id="t">Glow Worm</h1>
<p id="m">Eat orbs to grow. Make others crash into your body and they burst into orbs. Grab power-ups: M magnet, S shield, G ghost.</p>
<input id="nm" maxlength="12" placeholder="Your name" aria-label="Your name">
<div id="th"></div><p id="tht" style="font-size:12px;opacity:.7;margin:2px 0"></p><div id="sk"></div>
<p id="skt" style="font-size:12px;opacity:.7;margin:2px 0"></p>
<p id="ol" style="font-size:13px"></p>
<p id="lbt" style="display:none;margin:8px 0 0;font-size:12px;opacity:.7">Online leaderboard</p><ul id="lb"></ul><p id="hl" style="margin:8px 0 0;font-size:12px;opacity:.7">Best on this device</p><ul id="hall"></ul>
<p id="best"></p>
<div id="mainBtns"><button id="go">Play offline</button><button id="mp" class="alt">Multiplayer</button></div>
<div id="lob" class="hide">
<p style="font-weight:700;font-size:16px;margin:4px 0">Lobby code <span id="lcode"></span></p>
<p id="lm" style="font-size:13px"></p>
<p id="lp" style="font-size:13px"></p>
<div id="lnone"><button id="lnew" class="sm">Create lobby</button><br><input id="lin" maxlength="4" placeholder="Code" aria-label="Lobby code"><button id="ljoin" class="sm alt">Join</button></div>
<button id="lstart" class="sm hide">Start game</button><button id="lleave" class="sm alt hide">Leave lobby</button><button id="lback" class="sm alt">Back</button>
<p style="font-size:12px;opacity:.7">Up to 10 players per lobby. Friends need to be signed in to claude.ai and open this page.</p>
</div>
</div></div>
<script>
(function(){
var cv=document.getElementById('c'),cx=cv.getContext('2d'),W,H,D,SAT=0;
var pr=document.createElement('div');pr.style.cssText='position:fixed;top:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)';document.body.appendChild(pr);SAT=pr.offsetHeight;
function size(){D=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D}
size();addEventListener('resize',size);
var $=function(i){return document.getElementById(i)};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var R=1900,SP=7,COLS;
var NAMES=['Nova','Zig','Pixel','Blaze','Mochi','Echo','Comet','Orbit','Sparky','Luna','Vex','Juno'];
var SK=[{n:'Sky',min:0,css:'#3b9cff',f:function(){return'#3b9cff'}},
{n:'Sunset',min:400,css:'linear-gradient(135deg,#ff3d7f,#ffc83d)',f:function(i,n){return'hsl('+(345+(i/n)*70)%360+',95%,60%)'}},
{n:'Candy',min:1200,css:'linear-gradient(135deg,#ff6bd6 50%,#fff 50%)',f:function(i){return i%6<3?'#ff6bd6':'#ffffff'}},
{n:'Rainbow',min:2500,css:'linear-gradient(135deg,#f33,#fc3,#3f9,#39f,#a5f)',f:function(i,n,t){return'hsl('+((i*14+t*90)%360)+',95%,60%)'}},
{n:'Gold',min:4500,css:'linear-gradient(135deg,#ffe9a0,#ffc83d)',f:function(i,n,t){return i%2?'#ffc83d':(Math.sin(t*6+i*.4)>0?'#fff3c4':'#ffe08a')}}];
var TH=[
{n:'Meadow',top:'#e3f5cf',bot:'#a5d985',dot:'#2f6b2a',dotA:.2,out:'#2c5a2a',outA:.5,wall:'#6b4423',txt:'#1f3a1a',ink:'#1f3a1a',panel:'rgba(255,255,255,.9)',hot:'#e5484d',ice:'#2f8fe0',glow:0,dark:0,cols:['#e5484d','#f2a516','#7b5cd6','#f26b21','#1f9d63','#d6489e','#d4a017','#8a5a2b'],orb:['#e5484d','#f2a516','#7b5cd6','#f26b21','#d6489e','#3b82d6']},
{n:'Desert',top:'#f8e7bd',bot:'#e6b873',dot:'#8a5a1c',dotA:.22,out:'#6b4313',outA:.5,wall:'#7a2e12',txt:'#3b2410',ink:'#3b2410',panel:'rgba(255,248,232,.92)',hot:'#c2410c',ice:'#b45309',glow:0,dark:0,cols:['#c2410c','#7c3aed','#0f766e','#be123c','#4d7c0f','#a16207','#1d4ed8','#9d174d'],orb:['#c2410c','#7c3aed','#0f766e','#be123c','#1d4ed8','#a16207']},
{n:'Candy',top:'#ffe6f3',bot:'#ffc4e1',dot:'#c2185b',dotA:.16,out:'#8e2a5c',outA:.4,wall:'#d81b60',txt:'#5a1a3d',ink:'#5a1a3d',panel:'rgba(255,255,255,.92)',hot:'#d81b60',ice:'#7c4dff',glow:0,dark:0,cols:['#7c4dff','#00acc1','#fb8c00','#43a047','#e53935','#3949ab','#8e24aa','#f4511e'],orb:['#7c4dff','#00acc1','#fb8c00','#43a047','#e53935','#3949ab']},
{n:'Ocean',top:'#0b3d5c',bot:'#146f87',dot:'#bdeef5',dotA:.16,out:'#031a28',outA:.5,wall:'#ff8a65',txt:'#eaf8ff',ink:'#eaf8ff',panel:'rgba(8,38,58,.9)',hot:'#ff8a65',ice:'#7fe3f2',glow:0,dark:1,cols:['#ff8a65','#ffd54f','#ba68c8','#81c784','#f06292','#4dd0e1','#e57373','#fff176'],orb:['#ffd54f','#ff8a65','#f06292','#81c784','#ba68c8','#e0f7fa']},
{n:'Neon',top:'#120a33',bot:'#2b1048',dot:'#8f7bff',dotA:.22,out:'#07031c',outA:.5,wall:'#ff3d7f',txt:'#f3f0ff',ink:'#f3f0ff',panel:'rgba(22,12,64,.86)',hot:'#ff3d7f',ice:'#52e5ff',glow:1,dark:1,cols:['#ff3d7f','#ffc83d','#9d6bff','#ff7a3d','#5bffb0','#ff6bd6','#6bb2ff','#ffe86b'],orb:['#ff3d7f','#ffc83d','#9d6bff','#ff7a3d','#5bffb0','#6bb2ff']}];
var th=Math.min(+ls('gw-theme')||0,TH.length-1),LT='source-over';
var best=+ls('gw-best')||0,skin=Math.min(+ls('gw-skin')||0,SK.length-1),mute=ls('gw-mute')==='1';
var state='menu',worms=[],orbs=[],ups=[],parts=[],remotes={},me=null,cam={x:0,y:0},ptr={a:0,set:0},boosting=0,keys={},tm=0,upT=0,lastSend=0,sentAl=0;
var room=null,uid=null,dbh=null,online=0;
function rnd(a,b){return a+Math.random()*(b-a)}
function rp(m){var a=Math.random()*6.28,r=Math.sqrt(Math.random())*R*m;return{x:Math.cos(a)*r,y:Math.sin(a)*r}}
function nang(d){return Math.atan2(Math.sin(d),Math.cos(d))}

/* ---------- sound ---------- */
var ac=null,lastEat=0,mn=0;
function AC(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac}
function tone(f,f2,d,ty,v){if(mute||!ac)return;var t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}
function sfx(k){var n=performance.now();
if(k==='eat'){if(n-lastEat<70)return;lastEat=n;tone(520+Math.random()*180,900,.09,'sine',.08)}
else if(k==='up'){tone(400,1200,.25,'triangle',.12)}
else if(k==='pop'){tone(300,40,.5,'sawtooth',.14)}
else if(k==='kill'){tone(500,150,.18,'square',.07)}
else if(k==='shield'){tone(800,200,.3,'triangle',.12)}}
var PEN=[220,261.6,293.7,329.6,392,440,523.3,587.3];
setInterval(function(){if(mute||!ac)return;mn++;
if(mn%4===0)tone(PEN[[0,3,2,4][(mn>>2)%4]]/2,PEN[[0,3,2,4][(mn>>2)%4]]/2*1.001,.9,'sine',.07);
if(Math.random()<.75)tone(PEN[(Math.random()*PEN.length)|0],PEN[(Math.random()*PEN.length)|0]*.999+1,.3,'triangle',.03)},230);
function muteUI(){$('mu').textContent=mute?'\u2715':'\u266B'}muteUI();
$('mu').onclick=function(e){e.stopPropagation();AC();mute=!mute;ls('gw-mute',mute?'1':'0');muteUI()};

/* ---------- worms ---------- */
function mk(name,col,ai){var p=rp(.75),a=Math.random()*6.28,pts=[];
for(var i=0;i<14;i++)pts.push({x:p.x-Math.cos(a)*i*SP,y:p.y-Math.sin(a)*i*SP});
return{name:name,col:col,sk:-1,ai:ai,a:a,ta:a,pts:pts,grow:ai?rnd(0,25):0,dead:0,rt:0,boost:0,dt:0,tgt:null,tt:0,mag:0,sh:0,gh:0,inv:0,agg:Math.random()<.75}}
function nOrb(){var p=rp(.97);orbs.push({x:p.x,y:p.y,c:TH[th].orb[(Math.random()*TH[th].orb.length)|0],v:rnd(.6,1.2),r:rnd(4,6.5)})}
function all(){var a=worms.slice();for(var k in remotes)if(!remotes[k].dead)a.push(remotes[k]);return a}
function reset(){worms=[];orbs=[];ups=[];parts=[];for(var i=0;i<380;i++)nOrb();for(i=0;i<(mode==='mp'?3:9);i++)worms.push(mk(NAMES[i],COLS[i%COLS.length],1))}
function start(m){mode=(m==='mp'&&lobbyRoom)?'mp':'off';if(mode==='off')leaveLobby();AC();if(!$('nm').value.trim()){$('nm').focus();$('nm').placeholder='Type your name first';$('nm').style.borderColor='#e5484d';return}reset();me=mk($('nm').value.trim()||'Player','#3b9cff',0);me.sk=skin;ls('gw-name',me.name);me.grow=2;me.inv=2;worms.push(me);state='play';boosting=0;
$('ov').classList.add('hide');$('bst').classList.remove('hide')}
function radius(w){return 8+Math.min(w.grow,160)*.045}
function score(w){return Math.floor((w.grow+12)*10)}
function burst(x,y,c,n,s){for(var i=0;i<n;i++){var a=Math.random()*6.28,v=rnd(.3,1)*s;parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:c,s:rnd(2,4)})}}
function hurt(w,wall){if(w.dead||w.inv>0)return;
if(w.sh){w.sh=0;w.inv=1.3;burst(w.pts[0].x,w.pts[0].y,'#3b9cff',30,300);if(w===me)sfx('shield');if(wall)w.a=Math.atan2(-w.pts[0].y,-w.pts[0].x);return}
kill(w)}
function kill(w){if(w.dead)return;w.dead=1;w.rt=3;
for(var i=0;i<w.pts.length;i+=2){var p=w.pts[i];orbs.push({x:p.x+rnd(-9,9),y:p.y+rnd(-9,9),c:w.ai?w.col:'#3b9cff',v:2.5,r:8.5})}
burst(w.pts[0].x,w.pts[0].y,w.col,40,340);
if(w===me){sfx('pop');state='over';var s=score(me),nb=s>best;
if(nb){best=s;ls('gw-best',best)}
addHall(me.name,s);if(nb)postScore(s,me.name);
$('t').textContent='You popped';$('m').textContent='Final length '+s+(nb?' \u2014 a new best!':'.');
$('best').textContent='Best: '+best;showMain();$('bst').classList.add('hide');buildSk();
setTimeout(function(){$('ov').classList.remove('hide')},700)}else sfx('kill')}
$('go').onclick=function(){start('off')};
$('best').textContent=best?'Best: '+best:'';
$('nm').addEventListener('keydown',function(e){e.stopPropagation();if(e.key==='Enter')start(mode)});
function buildSk(){var h=$('sk');h.innerHTML='';
SK.forEach(function(s,i){var b=document.createElement('button'),ok=best>=s.min;b.style.background=s.css;b.setAttribute('aria-label',s.n+(ok?'':' (locked)'));
if(i===skin)b.className='on';if(!ok){b.className+=' lk';b.textContent='\uD83D\uDD12'}
b.onclick=function(){if(best<s.min){$('skt').textContent=s.n+' unlocks at a best score of '+s.min;return}skin=i;ls('gw-skin',i);buildSk()};h.appendChild(b)});
$('skt').textContent='Skin: '+SK[skin].n}
buildSk();

$('nm').value=ls('gw-name')||'';
function postScore(s,name){if(!dbh||!uid)return;
try{dbh.doc('scores/'+uid).set({name:String(name||'Player').slice(0,12),score:s,t:Date.now()}).then(function(){$('ol').textContent='Score saved to the online leaderboard'}).catch(function(e){$('ol').textContent='Online board: could not save ('+((e&&e.code)||'error')+')'})}catch(e){$('ol').textContent='Online board: could not save'}}
function hall(){try{return JSON.parse(ls('gw-hall')||'[]')}catch(e){return[]}}
function addHall(n,sc){var h=hall();h.push({n:n,s:sc});h.sort(function(a,b){return b.s-a.s});ls('gw-hall',JSON.stringify(h.slice(0,5)));renderHall()}
function renderHall(){var ul=$('hall');ul.innerHTML='';hall().forEach(function(r,i){var li=document.createElement('li'),a=document.createElement('span'),b=document.createElement('span');a.textContent=(i+1)+'. '+String(r.n).slice(0,12);b.textContent=r.s;li.appendChild(a);li.appendChild(b);ul.appendChild(li)});$('hl').style.display=ul.children.length?'':'none'}
function applyTheme(i,init){th=i;var T=TH[i];COLS=T.cols;LT=T.glow?'lighter':'source-over';ls('gw-theme',i);var st=document.documentElement.style;st.setProperty('--ink',T.ink);st.setProperty('--panel',T.panel);st.setProperty('--hot',T.hot);st.setProperty('--ice',T.ice);st.colorScheme=T.dark?'dark':'light';document.body.style.background=T.bot;if(!init&&state!=='play'){me=null;state='menu';reset()}}
function buildTh(){var h=$('th');h.innerHTML='';TH.forEach(function(T,i){var b=document.createElement('button');b.style.background='linear-gradient('+T.top+','+T.bot+')';b.setAttribute('aria-label',T.n+' theme');if(i===th)b.className='on';b.onclick=function(){applyTheme(i);buildTh()};h.appendChild(b)});$('tht').textContent='Theme: '+TH[th].n}
var rootRoom=null,lobbyRoom=null,mode='off',offPeers=null;
function mpMsg(t){$('lm').textContent=t}
function showLobby(){$('mainBtns').classList.add('hide');$('lob').classList.remove('hide');lobbyUI()}
function showMain(){$('lob').classList.add('hide');$('mainBtns').classList.remove('hide')}
function lobbyUI(){$('lnone').classList.toggle('hide',!!lobbyRoom);$('lstart').classList.toggle('hide',!lobbyRoom);$('lleave').classList.toggle('hide',!lobbyRoom);
if(!rootRoom&&!lobbyRoom)mpMsg('Multiplayer needs a signed-in claude.ai viewer. Use Play offline if you aren\u2019t signed in.')}
function leaveLobby(){try{if(offPeers)offPeers()}catch(e){}offPeers=null;if(lobbyRoom){try{lobbyRoom.leave()}catch(e){}}lobbyRoom=null;room=null;remotes={};online=0;$('lcode').textContent='';$('lp').textContent=''}
function joinLobby(code){
code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);
if(code.length<4){mpMsg('Enter the 4-character code');return}
var nm=$('nm').value.trim();if(!nm){$('nm').focus();$('nm').placeholder='Type your name first';$('nm').style.borderColor='#e5484d';mpMsg('Type your name first');return}
if(!rootRoom){lobbyUI();return}
leaveLobby();mpMsg('Joining '+code+'\u2026');
rootRoom.join('gw-'+code.toLowerCase()).then(function(r){
var first=true;lobbyRoom=r;room=r;
offPeers=r.onPeers(function(ch){
var pl=ch.peers.filter(function(p){return p.kind==='viewer'});
if(first){first=false;if(pl.length>10){leaveLobby();mpMsg('Lobby '+code+' is full (max 10 players).');lobbyUI();return}mpMsg('')}
var seen={},c=0,names=[];
pl.forEach(function(p){var s=p.presence||{};if(s.n)names.push(String(s.n).slice(0,12)+(p.isMe?' (you)':''));
if(p.isMe)return;
if(s.al&&typeof s.x==='number'&&typeof s.y==='number'){seen[p.peer]=1;c++;
var q=remotes[p.peer];if(!q){q=remotes[p.peer]={remote:1,ai:0,col:'#fff',pts:[],grow:0,dead:0,gh:0,sh:0,mag:0,inv:0,tx:s.x,ty:s.y,a:0,name:'Player',sk:0};for(var i=0;i<13;i++)q.pts.push({x:s.x,y:s.y})}
q.dead=0;q.tx=s.x;q.ty=s.y;q.a=+s.a||0;q.grow=Math.max(0,Math.min(400,+s.g||0));q.name=String(s.n||'Player').slice(0,12);q.sk=Math.max(0,Math.min(SK.length-1,s.s|0));q.gh=s.gh?1:0}});
for(var k in remotes)if(!seen[k])delete remotes[k];online=c;
$('lcode').textContent=code;$('lp').textContent=pl.length+'/10 players: '+names.join(', ')},
function(){mpMsg('Lost connection to the lobby')});
r.presence({lb:1,al:0,n:nm.slice(0,12)}).catch(function(){});
lobbyUI()
}).catch(function(e){mpMsg('Could not join ('+((e&&e.code)||'error')+')');lobbyUI()})}
$('mp').onclick=showLobby;$('lback').onclick=showMain;
$('lnew').onclick=function(){var c='',A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';for(var i=0;i<4;i++)c+=A[(Math.random()*A.length)|0];joinLobby(c)};
$('ljoin').onclick=function(){joinLobby($('lin').value)};
$('lleave').onclick=function(){leaveLobby();mpMsg('You left the lobby.');lobbyUI()};
$('lstart').onclick=function(){start('mp')};
$('lin').addEventListener('keydown',function(e){e.stopPropagation();if(e.key==='Enter')joinLobby($('lin').value)});
/* ---------- input ---------- */
function pm(e){ptr.a=Math.atan2(e.clientY-H/2,e.clientX-W/2);ptr.set=1}
cv.addEventListener('pointermove',pm);
cv.addEventListener('pointerdown',function(e){pm(e);if(e.pointerType==='mouse')boosting=1});
addEventListener('pointerup',function(e){if(e.pointerType==='mouse')boosting=0});
var bb=$('bst');
bb.addEventListener('pointerdown',function(e){e.stopPropagation();boosting=1;bb.setPointerCapture(e.pointerId)});
bb.addEventListener('pointerup',function(){boosting=0});bb.addEventListener('pointercancel',function(){boosting=0});
addEventListener('keydown',function(e){if(e.target.tagName==='INPUT')return;keys[e.key.toLowerCase()]=1;if(e.key===' ')boosting=1;if(e.key==='Enter'&&state!=='play')start(mode)});
addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=0;if(e.key===' ')boosting=0});

/* ---------- smarter AI ---------- */
function think(w,dt,A){
var h=w.pts[0],dc=Math.hypot(h.x,h.y),ta=w.a,i,j;w.boost=0;w.tt-=dt;
if(w.tt<=0){w.tt=.25;var bd=1e9,b=null;for(i=0;i<orbs.length;i++){var o=orbs[i],d=(o.x-h.x)*(o.x-h.x)+(o.y-h.y)*(o.y-h.y);if(d<bd){bd=d;b=o}}w.tgt=b}
var prey=null,pd=1e9,thr=null,td=1e9,aggr=w.agg&&(me?score(me)>300:1);
for(i=0;i<A.length;i++){var o2=A[i];if(o2===w||o2.dead)continue;var q=o2.pts[0],d2=Math.hypot(q.x-h.x,q.y-h.y);
if(o2.grow>w.grow*1.3+5&&d2<280&&d2<td){thr=o2;td=d2}
else if(aggr&&o2.grow<w.grow*1.15+10&&d2<540&&d2<pd){prey=o2;pd=d2}}
if(thr){var tq=thr.pts[0];ta=Math.atan2(h.y-tq.y,h.x-tq.x);w.boost=td<160&&w.grow>6}
else if(prey){var pq=prey.pts[0],lead=Math.min(1,pd/420)*190,px=pq.x+Math.cos(prey.a)*lead,py=pq.y+Math.sin(prey.a)*lead;ta=Math.atan2(py-h.y,px-h.x);w.boost=pd<340&&w.grow>8}
else if(w.tgt)ta=Math.atan2(w.tgt.y-h.y,w.tgt.x-h.x);
var hit=0;
for(var L=55;L<=115&&!hit;L+=60){var lx=h.x+Math.cos(w.a)*L,ly=h.y+Math.sin(w.a)*L;
for(j=0;j<A.length&&!hit;j++){var o3=A[j];if(o3===w||o3.dead||o3.gh>0)continue;var rr=radius(o3)+radius(w)+12;
for(var k=0;k<o3.pts.length;k+=2){var p=o3.pts[k];if((p.x-lx)*(p.x-lx)+(p.y-ly)*(p.y-ly)<rr*rr){var rel=nang(Math.atan2(p.y-h.y,p.x-h.x)-w.a);ta=w.a+(rel>0?-1.9:1.9);w.boost=0;hit=1;break}}}}
if(dc>R-280){ta=Math.atan2(-h.y,-h.x);w.boost=0}
w.ta=ta}

/* ---------- update ---------- */
function update(dt){
tm+=dt;var i,j,k,w,h,A=all();
for(i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.l-=dt*1.4;if(p.l<=0)parts.splice(i,1)}
var add=Math.min(6,380-orbs.length);for(i=0;i<add;i++)nOrb();
upT-=dt;if(upT<=0){upT=1.2;if(ups.length<5){var pp=rp(.9);ups.push({x:pp.x,y:pp.y,k:['M','S','G'][(Math.random()*3)|0]})}}
for(var key in remotes){var r=remotes[key];if(r.dead)continue;var q=r.pts[0],kk=Math.min(1,dt*10);q.x+=(r.tx-q.x)*kk;q.y+=(r.ty-q.y)*kk;
var n2=12+Math.floor(r.grow);while(r.pts.length<n2)r.pts.push({x:r.pts[r.pts.length-1].x,y:r.pts[r.pts.length-1].y});while(r.pts.length>n2)r.pts.pop();
for(j=1;j<r.pts.length;j++){var a=r.pts[j-1],b=r.pts[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy);if(d>SP){b.x=a.x-dx/d*SP;b.y=a.y-dy/d*SP}}}
for(i=0;i<worms.length;i++){w=worms[i];
if(w.dead){w.rt-=dt;if(w.ai&&w.rt<=0)worms[i]=mk(w.name,w.col,1);continue}
w.mag=Math.max(0,w.mag-dt);w.gh=Math.max(0,w.gh-dt);w.inv=Math.max(0,w.inv-dt);
if(w.ai)think(w,dt,A);else{
if(keys.arrowleft||keys.a)ptr.a=w.a-.16*60*dt;if(keys.arrowright||keys.d)ptr.a=w.a+.16*60*dt;
w.ta=ptr.set||keys.arrowleft||keys.arrowright||keys.a||keys.d?ptr.a:w.a;w.boost=boosting}
var da=nang(w.ta-w.a),tr=4.6-Math.min(w.grow,150)*.011;
w.a+=Math.max(-tr*dt,Math.min(tr*dt,da));
var bo=w.boost&&w.pts.length>16,sp=bo?310:165;
if(bo){w.grow=Math.max(0,w.grow-4*dt);w.dt-=dt;if(w.dt<=0){w.dt=.25;var tl=w.pts[w.pts.length-1];orbs.push({x:tl.x,y:tl.y,c:w.ai?w.col:'#3b9cff',v:1.2,r:6})}}
h=w.pts[0];h.x+=Math.cos(w.a)*sp*dt;h.y+=Math.sin(w.a)*sp*dt;
var n=12+Math.floor(w.grow);while(w.pts.length<n)w.pts.push({x:w.pts[w.pts.length-1].x,y:w.pts[w.pts.length-1].y});while(w.pts.length>n)w.pts.pop();
for(j=1;j<w.pts.length;j++){var a2=w.pts[j-1],b2=w.pts[j],dx2=a2.x-b2.x,dy2=a2.y-b2.y,d3=Math.sqrt(dx2*dx2+dy2*dy2);if(d3>SP){b2.x=a2.x-dx2/d3*SP;b2.y=a2.y-dy2/d3*SP}}
var hr=radius(w),mr=w.mag>0?hr+260:hr+60;
for(j=orbs.length-1;j>=0;j--){var o=orbs[j],ex=h.x-o.x,ey=h.y-o.y,dd=ex*ex+ey*ey;
if(dd<mr*mr){var qq=Math.sqrt(dd)||1;o.x+=ex/qq*dt*(w.mag>0?520:320);o.y+=ey/qq*dt*(w.mag>0?520:320)}
if(dd<(hr+o.r+6)*(hr+o.r+6)){w.grow+=o.v*.4;orbs.splice(j,1);if(w===me)sfx('eat')}}
if(w===me)for(j=ups.length-1;j>=0;j--){var u=ups[j];if((u.x-h.x)*(u.x-h.x)+(u.y-h.y)*(u.y-h.y)<(hr+22)*(hr+22)){
if(u.k==='M')w.mag=8;else if(u.k==='S')w.sh=1;else w.gh=6;sfx('up');burst(u.x,u.y,u.k==='M'?'#ffc83d':u.k==='S'?'#3b9cff':'#8a5cf0',24,260);ups.splice(j,1)}}
if(Math.hypot(h.x,h.y)>R){hurt(w,1);continue}
if(w.gh>0)continue;
for(j=0;j<A.length;j++){var o3=A[j];if(o3===w||o3.dead||o3.gh>0)continue;var rr2=(hr+radius(o3))*.72;
for(k=0;k<o3.pts.length;k++){var pt=o3.pts[k];if((pt.x-h.x)*(pt.x-h.x)+(pt.y-h.y)*(pt.y-h.y)<rr2*rr2){hurt(w,0);j=999;break}}}}
if(me&&!me.dead){cam.x+=(me.pts[0].x-cam.x)*Math.min(1,dt*8);cam.y+=(me.pts[0].y-cam.y)*Math.min(1,dt*8)}
else if(state==='menu'){var f=worms[0];if(f&&!f.dead){cam.x+=(f.pts[0].x-cam.x)*Math.min(1,dt*3);cam.y+=(f.pts[0].y-cam.y)*Math.min(1,dt*3)}}
/* online presence */
if(room){var now=performance.now();
if(state==='play'&&me&&!me.dead){if(now-lastSend>66){lastSend=now;var hh=me.pts[0];sentAl=1;room.presence({al:1,x:Math.round(hh.x),y:Math.round(hh.y),a:+me.a.toFixed(2),g:+me.grow.toFixed(1),n:me.name,s:me.sk,gh:me.gh>0?1:0}).catch(function(){})}}
else if(sentAl){sentAl=0;room.presence({al:0}).catch(function(){})}}}

/* ---------- draw ---------- */
function colAt(w,i,n){return w.sk>=0?SK[w.sk].f(i,n,tm):w.col}
function drawWorm(w){
var n=w.pts.length,r=radius(w),i,p,al=w.gh>0?.4:1;
cx.globalCompositeOperation=LT;cx.globalAlpha=.1*al;
for(i=n-1;i>=0;i-=2){p=w.pts[i];cx.fillStyle=colAt(w,i,n);cx.beginPath();cx.arc(p.x,p.y,r*2.3,0,6.28);cx.fill()}
cx.globalCompositeOperation='source-over';
for(i=n-1;i>=0;i--){p=w.pts[i];var rr=r*(1-i/n*.35);
cx.globalAlpha=al;cx.fillStyle=colAt(w,i,n);cx.beginPath();cx.arc(p.x,p.y,rr,0,6.28);cx.fill();
cx.globalAlpha=.28*al;cx.fillStyle='#fff';cx.beginPath();cx.arc(p.x-rr*.2,p.y-rr*.25,rr*.55,0,6.28);cx.fill()}
cx.globalAlpha=al;var h=w.pts[0],ca=Math.cos(w.a),sa=Math.sin(w.a);
for(var s=-1;s<=1;s+=2){var ex=h.x+ca*r*.35-sa*s*r*.5,ey=h.y+sa*r*.35+ca*s*r*.5;
cx.fillStyle='#fff';cx.beginPath();cx.arc(ex,ey,r*.38,0,6.28);cx.fill();
cx.fillStyle='#1a1040';cx.beginPath();cx.arc(ex+ca*r*.14,ey+sa*r*.14,r*.19,0,6.28);cx.fill()}
if(w.sh||w.inv>0){cx.globalAlpha=.8;cx.strokeStyle=TH[th].txt;cx.lineWidth=3;cx.beginPath();cx.arc(h.x,h.y,r+9+Math.sin(tm*8)*2,0,6.28);cx.stroke()}
if(w.mag>0){cx.globalAlpha=.25;cx.strokeStyle='#ffc83d';cx.lineWidth=2;cx.beginPath();cx.arc(h.x,h.y,r+260,0,6.28);cx.stroke()}
if(w.remote||w.ai===0&&w!==me){cx.globalAlpha=.9;cx.fillStyle=TH[th].txt;cx.font='600 14px "Chakra Petch",system-ui,sans-serif';cx.textAlign='center';cx.fillText(w.name,h.x,h.y-r-12)}
cx.globalAlpha=1}
var UC={M:'#e8a200',S:'#3b9cff',G:'#8a5cf0'};
function draw(){
cx.setTransform(D,0,0,D,0,0);
var g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,TH[th].top);g.addColorStop(1,TH[th].bot);cx.fillStyle=g;cx.fillRect(0,0,W,H);
var z=me&&!me.dead?Math.max(.55,1-me.grow*.0016):.8;
cx.save();cx.translate(W/2,H/2);cx.scale(z,z);cx.translate(-cam.x,-cam.y);
var vx=W/2/z+40,vy=H/2/z+40,i,gs=90;
cx.fillStyle=TH[th].dot;cx.globalAlpha=TH[th].dotA;
var x0=Math.floor((cam.x-vx)/gs)*gs,y0=Math.floor((cam.y-vy)/gs)*gs;
for(var gx=x0;gx<cam.x+vx;gx+=gs)for(var gy=y0;gy<cam.y+vy;gy+=gs)cx.fillRect(gx-1.5,gy-1.5,3,3);
cx.globalAlpha=TH[th].outA;cx.fillStyle=TH[th].out;cx.beginPath();cx.rect(cam.x-vx-2000,cam.y-vy-2000,vx*2+4000,vy*2+4000);cx.arc(0,0,R,0,6.28,true);cx.fill('evenodd');
cx.globalAlpha=1;cx.strokeStyle=TH[th].wall;cx.lineWidth=7;cx.beginPath();cx.arc(0,0,R,0,6.28);cx.stroke();
cx.globalAlpha=.25;cx.lineWidth=26;cx.stroke();cx.globalAlpha=1;
for(i=0;i<orbs.length;i++){var o=orbs[i];if(Math.abs(o.x-cam.x)>vx||Math.abs(o.y-cam.y)>vy)continue;
cx.globalCompositeOperation=LT;cx.globalAlpha=.2;cx.fillStyle=o.c;cx.beginPath();cx.arc(o.x,o.y,o.r*2.6,0,6.28);cx.fill();
cx.globalCompositeOperation='source-over';cx.globalAlpha=1;cx.beginPath();cx.arc(o.x,o.y,o.r,0,6.28);cx.fill()}
for(i=0;i<ups.length;i++){var u=ups[i],pl=1+Math.sin(tm*5+i)*.12;cx.save();cx.translate(u.x,u.y);cx.scale(pl,pl);
cx.globalCompositeOperation=LT;cx.globalAlpha=.3;cx.fillStyle=UC[u.k];cx.beginPath();cx.arc(0,0,34,0,6.28);cx.fill();
cx.globalCompositeOperation='source-over';cx.globalAlpha=1;cx.strokeStyle=UC[u.k];cx.lineWidth=4;cx.beginPath();cx.arc(0,0,20,0,6.28);cx.stroke();
cx.fillStyle=TH[th].txt;cx.font='700 20px "Chakra Petch",system-ui,sans-serif';cx.textAlign='center';cx.fillText(u.k,0,7);cx.restore()}
var A=all();for(i=0;i<A.length;i++)if(!A[i].dead)drawWorm(A[i]);
cx.globalCompositeOperation=LT;
for(i=0;i<parts.length;i++){var p=parts[i];cx.globalAlpha=Math.max(0,p.l);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.s,0,6.28);cx.fill()}
cx.globalCompositeOperation='source-over';cx.globalAlpha=1;cx.restore();
if(state==='play'){
var top=SAT+14;cx.textAlign='left';cx.fillStyle=TH[th].txt;cx.font='700 22px "Chakra Petch",system-ui,sans-serif';
cx.fillText('Length '+score(me),16,top+20);
cx.font='600 14px "Chakra Petch",system-ui,sans-serif';var yy=top+42;
if(me.mag>0){cx.fillStyle=UC.M;cx.fillText('Magnet '+Math.ceil(me.mag)+'s',16,yy);yy+=18}
if(me.sh){cx.fillStyle=UC.S;cx.fillText('Shield ready',16,yy);yy+=18}
if(me.gh>0){cx.fillStyle=UC.G;cx.fillText('Ghost '+Math.ceil(me.gh)+'s',16,yy);yy+=18}
if(online){cx.fillStyle=TH[th].txt;cx.globalAlpha=.7;cx.fillText('Online: '+(online+1),16,yy);cx.globalAlpha=1}
var lb=A.filter(function(a){return!a.dead}).sort(function(a,b){return b.grow-a.grow}),rk=lb.indexOf(me);lb=lb.slice(0,5);if(rk>4)lb.push(me);
cx.textAlign='right';cx.font='500 14px "Chakra Petch",system-ui,sans-serif';
for(i=0;i<lb.length;i++){cx.fillStyle=lb[i]===me?'#e07b00':TH[th].txt;cx.globalAlpha=lb[i]===me?1:.8;cx.fillText((lb[i]===me?rk+1:i+1)+'. '+lb[i].name+'  '+score(lb[i]),W-16,top+18+i*19)}
cx.globalAlpha=1;
var mx=W-70,my=H-190,mr=46;cx.fillStyle='rgba(0,0,0,.3)';cx.beginPath();cx.arc(mx,my,mr,0,6.28);cx.fill();
cx.strokeStyle=TH[th].wall;cx.lineWidth=2;cx.stroke();
for(i=0;i<A.length;i++){var q=A[i];if(q.dead)continue;var h=q.pts[0];cx.fillStyle=q===me?'#3b9cff':q.remote?'#fff':q.col;cx.beginPath();cx.arc(mx+h.x/R*mr,my+h.y/R*mr,q===me?3.5:2.2,0,6.28);cx.fill()}}}

var last=performance.now();
applyTheme(th,1);buildTh();renderHall();reset();
function loop(now){var dt=Math.min((now-last)/1000,.05);last=now;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

/* ---------- online (lights up only when the viewer can connect) ---------- */
$('ol').textContent='Online play is checking\u2026';
(async function(){
if(typeof claude==='undefined'||!claude.use){$('ol').textContent='Solo mode';return}
try{var us=await claude.use('user');if(us)uid=await us.id()}catch(e){}
try{dbh=await claude.use('db');
if(dbh){dbh.collection('scores').orderBy('score','desc').limit(8).onSnapshot(function(s){
var ul=$('lb');ul.innerHTML='';$('lbt').style.display=s.docs.length?'':'none';
s.docs.forEach(function(d,i){var v=d.data()||{},li=document.createElement('li'),a=document.createElement('span'),b=document.createElement('span');
a.textContent=(i+1)+'. '+String(v.name||'Player').slice(0,12);b.textContent=v.score|0;li.appendChild(a);li.appendChild(b);ul.appendChild(li)})},function(){});try{if(uid)dbh.doc('scores/'+uid).get().then(function(sn){var v=sn&&sn.data&&sn.data();if(best>0&&(!v||(v.score|0)<best))postScore(best,ls('gw-name')||'Player')}).catch(function(){})}catch(e){}}}catch(e){dbh=null}
try{rootRoom=await claude.use('room');
$('ol').textContent=rootRoom?'Multiplayer available':(dbh?'Leaderboard on. Multiplayer needs a signed-in claude.ai viewer.':'Offline play only')}catch(e){$('ol').textContent='Offline play only'}
})();
})();
